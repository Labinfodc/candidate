<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhD Student Lab Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#64748b;">
        Loading...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Runtime error:', e.message);
        document.getElementById('root').innerHTML = 
          '<div style="padding:2rem;font-family:system-ui;"><h2 style="color:#dc2626;">Error Loading App</h2><p>Check browser console (F12) for details.</p><pre style="background:#f1f5f9;padding:1rem;border-radius:0.5rem;overflow:auto;">' + e.message + '</pre></div>';
      });
    </script>
  </body>
</html>
